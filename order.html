<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ยืนยันคำสั่งซื้อ | LUMORA</title>
  <meta name="description" content="LUMORA — Light Your Moment กรอกข้อมูลเพื่อยืนยันคำสั่งซื้อเทียนหอมของคุณ" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="container section--tight">
    <a href="index.html" class="logo">LUMORA</a>
  </header>

  <main class="container form-page section--tight">
    <div class="editorial-header">
      <span class="eyebrow">Light Your Moment</span>
      <h1>ยืนยันคำสั่งซื้อ</h1>
      <p class="text-muted">กรุณากรอกข้อมูลของคุณให้ครบถ้วน ทีมงาน LUMORA จะติดต่อกลับเพื่อยืนยันการจัดส่ง</p>
    </div>

    <hr class="deco-hr" />

    <form id="orderForm" novalidate>

      <div class="form-group">
        <label class="form-label" for="customerName">ชื่อลูกค้า</label>
        <input
          class="form-input"
          type="text"
          id="customerName"
          name="customerName"
          placeholder="ชื่อ-นามสกุล"
          autocomplete="name"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="contact">เบอร์โทร / Line</label>
        <input
          class="form-input"
          type="text"
          id="contact"
          name="contact"
          placeholder="เบอร์โทรศัพท์ หรือ Line ID"
          autocomplete="tel"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="items">รายการสินค้า</label>
        <textarea
          class="form-textarea"
          id="items"
          name="items"
          rows="4"
          readonly
        ></textarea>
      </div>

      <div class="form-summary">
        <span class="form-summary__label">จำนวนเงินรวม</span>
        <span class="form-summary__value">
          <input
            class="form-input"
            type="text"
            id="total"
            name="total"
            readonly
            style="border: none; background: transparent; text-align: right; font-family: inherit; font-size: inherit; color: inherit; padding: 0; width: auto;"
          />
        </span>
      </div>

      <div class="form-group">
        <label class="form-label" for="note">หมายเหตุ</label>
        <textarea
          class="form-textarea"
          id="note"
          name="note"
          rows="3"
          placeholder="ระบุความต้องการเพิ่มเติม (ถ้ามี)"
        ></textarea>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">ยืนยันสั่งซื้อ</button>
      </div>

    </form>
  </main>

  <footer class="container section--tight">
    <p class="text-muted" style="text-align:center; font-size: var(--fs-xs);">
      © LUMORA — Light Your Moment
    </p>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
